name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "scripts/deploy-ec2.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            export DEPLOY_PATH="${{ secrets.EC2_DEPLOY_PATH }}"
            bash "${DEPLOY_PATH:-$HOME/Multi-Tenant-Enterprise-Knowledge-Platform-RAG-}/scripts/deploy-ec2.sh"
